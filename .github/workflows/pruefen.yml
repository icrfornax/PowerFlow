name: Pruefen

# Tuersteher fuer jede Aenderung am Code oder an den Daten. Er laeuft ohne
# Netzzugriff -- geprueft wird, was im Repository liegt.
#
# Der paths-Filter muss JEDE Datei nennen, die auf der Seite landet oder die
# Pruefung beeinflusst. Fehlt eine, laeuft ihre Aenderung ungeprueft durch.
# Bei jeder neuen Datei mitpflegen.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".nojekyll"
      - "assets/**"
      - "data/**"
      - "scripts/**"
      - "LIZENZ-DATEN.md"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "index.html"
      - ".nojekyll"
      - "assets/**"
      - "data/**"
      - "scripts/**"
      - "LIZENZ-DATEN.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tuersteher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Pruefungen
        run: python scripts/validate.py

      - name: Quellenverzeichnis und sein Waechter
        run: |
          python scripts/quellen.py
          python scripts/quellen.py --negativtest
          git diff --exit-code -- data/quellen.json

      - name: Negativtests
        # Eine Pruefung, die nie hat fehlschlagen sehen, ist keine Pruefung.
        run: python scripts/validate.py --negativtests

      - name: JavaScript-Syntax
        run: node --check assets/powerflow.js

      - name: Browsertest
        # Steuert den auf dem Runner vorhandenen Chrome ueber das
        # DevTools-Protokoll. Keine zusaetzliche Abhaengigkeit -- Node bringt
        # seit v22 einen WebSocket-Client mit, Chrome kann den Debug-Port von
        # Haus aus. Geprueft werden Dark, Light, 390 px, alle Info-Knoepfe,
        # jedes Bedienelement, der CSV-Abzug und die Konsole.
        run: |
          python -m http.server 8080 --bind 127.0.0.1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done
          node scripts/browsertest.mjs http://127.0.0.1:8080

      - name: Bildschirmfotos aufheben
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browsertest
          path: .browsertest/
          if-no-files-found: ignore
          retention-days: 14
